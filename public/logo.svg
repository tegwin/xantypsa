<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Xanty PSA">
  <defs>
    <linearGradient id="xBlue" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2a9df4"/>
      <stop offset="1" stop-color="#1248b8"/>
    </linearGradient>
    <linearGradient id="xGreen" x1="110" y1="420" x2="440" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e7fb8"/>
      <stop offset="0.45" stop-color="#17a98a"/>
      <stop offset="1" stop-color="#5cc734"/>
