# Render alternative to railway.json — same image, same health check.
services:
  - type: web
    name: xantypsa
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: xantypsa-db
          property: connectionString
      - key: DIRECT_DATABASE_URL
        fromDatabase:
          name: xantypsa-db
          property: connectionString
      - key: AI_ENCRYPTION_KEY
        generateValue: true
      - key: DEPLOYMENT_MODE
        value: hosted
      - key: NEXT_PUBLIC_APP_URL
        sync: false

databases:
  - name: xantypsa-db
    plan: basic-256mb
    postgresMajorVersion: '16'
