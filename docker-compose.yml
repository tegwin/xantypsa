# ============================================================
# Self-hosting XantyPSA
# ============================================================
#   cp .env.docker.example .env
#   docker compose up -d
#   → http://localhost:3000
#
# Brings its own PostgreSQL, so nothing needs installing but Docker. The same
# image is what runs on Railway or Render - if it works here, it works there.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xantypsa}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-xantypsa}
    volumes:
      - xantypsa-db:/var/lib/postgresql/data
    healthcheck:
      # The app must not start against a database still coming up, or the first
      # schema sync fails and the container restart-loops.
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-xantypsa} -d ${POSTGRES_DB:-xantypsa}']
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published by default: the app reaches it over the compose network,
    # and exposing Postgres to the host is a needless risk. Uncomment to use a
    # GUI client.
    # ports:
    # - '5432:5432'

  app:
    # Named so the image can be built once and reused, and so a published
    # image can be pulled instead of built:
    #   docker compose pull && docker compose up -d
    image: xantypsa:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-xantypsa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-xantypsa}
      DIRECT_DATABASE_URL: postgresql://${POSTGRES_USER:-xantypsa}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-xantypsa}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AI_ENCRYPTION_KEY: "${AI_ENCRYPTION_KEY:?generate one with openssl rand -hex 32}"
      # First-run administrator. Leave the password unset and one is generated
      # and printed to the logs once.
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@admin.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      # self_hosted hides everything to do with billing and plan limits.
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self_hosted}
      RUN_SEED: ${RUN_SEED:-true}
    ports:
      - '${PORT:-3000}:3000'

volumes:
  xantypsa-db:
